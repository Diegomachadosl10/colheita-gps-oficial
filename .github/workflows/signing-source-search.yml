name: Procurar assinatura em nomes alternativos protegidos

on:
  push:
    branches: [dm-agro-professional-beta]
    paths:
      - '.github/workflows/signing-source-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    if: github.repository == 'Diegomachadosl10/colheita-gps-oficial' && github.ref == 'refs/heads/dm-agro-professional-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidates: ${{ steps.available.outputs.candidates }}
    steps:
      - name: Conferir apenas presença nos nomes de assinatura conhecidos
        id: available
        # Only booleans reach this process; secret values are not enumerated or logged.
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 != '' }}
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
          HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
          HAS_ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
          HAS_DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
          HAS_DM_AGRO_KEYSTORE_BASE64: ${{ secrets.DM_AGRO_KEYSTORE_BASE64 != '' }}
          HAS_DM_AGRO_KEYSTORE: ${{ secrets.DM_AGRO_KEYSTORE != '' }}
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          names = [
              'ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_B64', 'KEYSTORE_BASE64', 'KEYSTORE_B64',
              'SIGNING_KEY', 'ANDROID_SIGNING_KEY', 'ANDROID_SIGNING_KEYSTORE_BASE64',
              'DEBUG_KEYSTORE_BASE64', 'ANDROID_DEBUG_KEYSTORE_BASE64',
              'DM_AGRO_KEYSTORE_BASE64', 'DM_AGRO_KEYSTORE', 'ANDROID_KEYSTORE',
          ]
          found = [name for name in names if os.environ.get('HAS_' + name, '').lower() == 'true']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('candidates=' + json.dumps(found) + '\n')
          message = f'{len(found)} nomes alternativos de assinatura disponíveis.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Busca de assinatura\n\n' + message + '\n\n')
              if found:
                  summary.write('Candidatos: ' + ', '.join(found) + '. O certificado ainda precisa conferir.\n')
              else:
                  summary.write('Nenhum dos 12 nomes verificados está disponível. Isso não enumera outros nomes desconhecidos.\n')
              summary.write('Nenhum valor de segredo foi exibido, nenhuma chave nova foi gerada e nenhum APK foi produzido.\n')
          PY

  verify:
    needs: locate
    if: needs.locate.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        secret_name: ${{ fromJSON(needs.locate.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar diagnóstico sem credencial real
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_signing.py'
      - name: Conferir um candidato contra o certificado permanente
        env:
          ANDROID_UPDATE_KEYSTORE_BASE64: ${{ secrets[matrix.secret_name] }}
        run: python3 .github/scripts/check-signing.py
