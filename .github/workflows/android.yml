name: Gerar APK Colheita GPS

on:
  push:
    branches: [main, dm-agro-login]
  workflow_dispatch:

permissions:
  contents: read

# Serializa builds da mesma ramificação para manter a chave de teste no cache.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/firebase
      - name: Verificar isolamento das equipes e anexos
        run: tests/firebase/node_modules/.bin/firebase emulators:exec --project demo-dm-agro --only firestore,storage 'cd tests/firebase && npm test'

  build:
    needs: firebase-rules
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preservar assinatura dos próximos APKs de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dm-agro-debug-keystore-v1-${{ github.ref_name }}

      - name: Testar permissões e gerar APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DM-AGRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DM-AGRO-Testes
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
