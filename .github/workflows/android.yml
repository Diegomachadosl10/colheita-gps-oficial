name: Gerar APK Colheita GPS

on:
  push:
    branches: [main, dm-agro-login]
  workflow_dispatch:
    inputs:
      publicar_atualizacao:
        description: Publicar atualização para os aplicativos instalados
        type: boolean
        required: false
        default: false
      melhorias:
        description: Melhorias que aparecerão no aplicativo
        type: string
        required: false
        default: Melhorias e correções do DM AGRO.

permissions:
  contents: read

# Serializa builds da mesma ramificação para manter a chave de teste no cache.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar serviço gratuito e limites das equipes
        run: node backend/worker.test.mjs
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/firebase
      - name: Verificar isolamento das equipes e anexos
        run: tests/firebase/node_modules/.bin/firebase emulators:exec --project demo-dm-agro --only firestore,storage 'cd tests/firebase && npm test'

  build:
    needs: [firebase-rules, backend]
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar ferramentas para conferir o APK
        run: sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar a assinatura permanente
        env:
          ANDROID_UPDATE_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPDATE_KEYSTORE_BASE64 }}
        run: python3 scripts/restore-signing.py

      - name: Testar permissões e gerar APK
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Preparar atualização e conferir assinatura
        env:
          UPDATE_NOTES: ${{ inputs.melhorias || 'Melhorias e correções do DM AGRO.' }}
        run: |
          python3 scripts/prepare-update.py --apk app/build/outputs/apk/debug/app-debug.apk --output release --build-tools "$ANDROID_HOME/build-tools/35.0.0"

      - name: Disponibilizar pacote da atualização
        uses: actions/upload-artifact@v4
        with:
          name: DM-AGRO-Atualizacao
          path: release/
          if-no-files-found: error

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DM-AGRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DM-AGRO-Testes
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  publish-update:
    if: github.event_name == 'workflow_dispatch' && inputs.publicar_atualizacao && github.ref == 'refs/heads/dm-agro-login'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DM-AGRO-Atualizacao
          path: release
      - name: Publicar arquivos completos para a atualização interna
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-update.py
